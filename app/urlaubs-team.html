<title>Urlaubs-Team</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: Kopfleiste mit Reiter, darunter Filter und ein Kachelraster (eine Kachel = eine Reise); Detailansicht mit Tabs. Airbnb-nahe Ruhe: viel Weißraum, große Bildfläche, abgerundete Kacheln. */
:root {
  --font: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --bg: #ffffff; --soft: #f7f6f3; --line: #e8e5df; --line-2: #d6d2ca;

  --ok: #17794b; --ok-soft: #e1f3e9; --warn: #8f5a07; --warn-soft: #fbefd2; --bad: #b3312b; --bad-soft: #fae2e0; --info: #1d5fa8; --info-soft: #e2edf9; --idle: #5d5a55; --idle-soft: #eeece8;
  --shadow: 0 1px 2px rgba(30,25,20,.06), 0 6px 20px rgba(30,25,20,.07);
  --shadow-hover: 0 2px 4px rgba(30,25,20,.08), 0 14px 34px rgba(30,25,20,.14);
  --r: 16px; --r-s: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161514; --soft: #1f1e1c; --line: #34312d; --line-2: #4a4641;
    --ink: #f3f0ec; --ink-2: #bdb8b1; --ink-3: #9d988f;
    --accent: #ff6279; --accent-ink: #2a0a10; --accent-soft: #3a1b22;
    --ok: #6bd6a3; --ok-soft: #173a2b; --warn: #eab75a; --warn-soft: #3b2e12; --bad: #ff948b; --bad-soft: #43201e; --info: #7db6f0; --info-soft: #1a2f47; --idle: #bdb8b1; --idle-soft: #2a2825;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.3); --shadow-hover: 0 2px 4px rgba(0,0,0,.5), 0 14px 34px rgba(0,0,0,.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161514; --soft: #1f1e1c; --line: #34312d; --line-2: #4a4641;
  --ink: #f3f0ec; --ink-2: #bdb8b1; --ink-3: #9d988f;
  --accent: #ff6279; --accent-ink: #2a0a10; --accent-soft: #3a1b22;
  --ok: #6bd6a3; --ok-soft: #173a2b; --warn: #eab75a; --warn-soft: #3b2e12; --bad: #ff948b; --bad-soft: #43201e; --info: #7db6f0; --info-soft: #1a2f47; --idle: #bdb8b1; --idle-soft: #2a2825;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.3); --shadow-hover: 0 2px 4px rgba(0,0,0,.5), 0 14px 34px rgba(0,0,0,.45);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; font: 15px/1.5 var(--font); color: var(--ink); background: var(--bg); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 64px; min-height: 100vh; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--bg); }
h1, h2, h3, p { margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
h1 { font-size: 28px; line-height: 1.2; font-weight: 700; letter-spacing: -.02em; }
h2 { font-size: 20px; font-weight: 650; letter-spacing: -.01em; }
h3 { font-size: 13px; font-weight: 650; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
.wrap { max-width: 1240px; margin: 0 auto; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.ico { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* Kopf */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 12px max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--line); }
.bar-in { max-width: 1240px; margin: 0 auto; display: flex; align-items: center; gap: 12px 24px; flex-wrap: wrap; }
.brand { font-weight: 700; font-size: 19px; letter-spacing: -.02em; color: var(--accent); display: flex; align-items: center; gap: 8px; }
.nav { display: flex; gap: 4px; margin-left: auto; }
.nav button { border: 0; background: none; padding: 12px 14px; font-weight: 550; color: var(--ink-2); border-bottom: 2px solid transparent; }
.nav button[aria-current="page"] { color: var(--ink); border-bottom-color: var(--ink); }
.nav button:hover { color: var(--ink); }
main { padding-top: 28px; }
.page { animation: in .25s ease-out; }
@keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { * { animation-duration: .001ms !important; transition-duration: .001ms !important; } }

/* Filter */
.filters { display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: center; margin: 20px 0 24px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 7px 14px; border: 1px solid var(--line-2); border-radius: 999px; background: var(--bg); color: var(--ink-2); font-weight: 550; font-size: 14px; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.field-s { padding: 8px 12px; border: 1px solid var(--line-2); border-radius: var(--r-s); background: var(--bg); min-width: 0; }
.filters .grow { flex: 1 1 200px; }

/* Suchleiste */
.sbar { display: flex; align-items: center; gap: 8px; margin: 16px 0 4px; padding: 6px 6px 6px 22px; border: 1px solid var(--line-2); border-radius: 999px; background: var(--bg); box-shadow: var(--shadow); max-width: 820px; }
.sbar:focus-within { border-color: var(--accent); }
.sbar input { flex: 1; min-width: 0; border: 0; outline: none; background: none; font-size: 16px; padding: 10px 0; }
.sbar .btn { border-radius: 999px; padding: 11px 22px; white-space: nowrap; }
.sbar .short { display: none; }
@media (max-width: 560px) { .sbar { padding-left: 16px; } .sbar .long { display: none; } .sbar .short { display: inline; } .sbar .btn { padding: 10px 16px; } }

.img img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.badge { position: absolute; left: 12px; top: 12px; z-index: 2; padding: 4px 11px; border-radius: 999px; font-size: 12.5px; font-weight: 650; background: var(--bg); color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,.18); }
.badge.s-Beobachten { color: var(--warn); } .badge.s-Buchungsreif { color: var(--ok); } .badge.s-Gebucht { color: var(--ok); } .badge.s-Recherche { color: var(--info); }
.kebab { position: absolute; right: 10px; top: 10px; z-index: 3; width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--bg); display: grid; place-items: center; box-shadow: 0 1px 4px rgba(0,0,0,.18); }
.menu { position: absolute; right: 10px; top: 48px; z-index: 5; min-width: 180px; padding: 6px; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow-hover); }
.menu button { display: block; width: 100%; padding: 9px 12px; border: 0; background: none; border-radius: 8px; text-align: left; }
.menu button:hover { background: var(--soft); }
.open-card { all: unset; cursor: pointer; display: block; padding-top: 12px; }
.open-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 8px; }
.c-title { font-weight: 650; font-size: 16px; overflow-wrap: anywhere; }
.c-sub { color: var(--ink-2); font-size: 14px; overflow-wrap: anywhere; }
.c-row { display: flex; align-items: center; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
.price { font-weight: 650; }
.price small { font-weight: 400; color: var(--ink-3); }
.trend { font-weight: 650; font-size: 13px; padding: 1px 7px; border-radius: 999px; }
.trend.down { background: var(--ok-soft); color: var(--ok); } .trend.up { background: var(--bad-soft); color: var(--bad); } .trend.flat { background: var(--idle-soft); color: var(--idle); }
.meta { color: var(--ink-3); font-size: 13px; }
.new-card .img { background: var(--soft); border: 2px dashed var(--line-2); box-shadow: none; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 8px; color: var(--ink-2); font-size: 15px; font-weight: 600; }
.new-card .img .plus { width: 44px; height: 44px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
.avatars { display: flex; }
.av { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; color: #fff; border: 2px solid var(--bg); margin-left: -7px; }
.av:first-child { margin-left: 0; }

/* Allgemein */
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: var(--r-s); border: 1px solid var(--line-2); background: var(--bg); font-weight: 600; text-decoration: none; color: var(--ink); }
.btn:hover { background: var(--soft); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.sm { padding: 5px 11px; font-size: 13.5px; }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.box { border: 1px solid var(--line); border-radius: var(--r); padding: 20px; background: var(--bg); }
.soft { background: var(--soft); border-radius: var(--r); padding: 20px; }
.empty { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; padding: 44px 20px; color: var(--ink-2); border: 1px dashed var(--line-2); border-radius: var(--r); }
.empty b { color: var(--ink); font-size: 17px; }
.status { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 650; background: var(--idle-soft); color: var(--idle); }
.status.ok { background: var(--ok-soft); color: var(--ok); } .status.warn { background: var(--warn-soft); color: var(--warn); } .status.bad { background: var(--bad-soft); color: var(--bad); } .status.info { background: var(--info-soft); color: var(--info); }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.sp { flex: 1; }
.back { border: 0; background: none; color: var(--ink-2); font-weight: 600; padding: 0; display: inline-flex; gap: 6px; align-items: center; margin-bottom: 14px; }
.hero { display: flex; gap: 24px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 20px; }
.hero .img { width: 200px; aspect-ratio: 4/3; font-size: 48px; flex: none; }
.hero .txt { flex: 1 1 280px; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.tabs { display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--line); margin-bottom: 24px; }
.tabs button { border: 0; background: none; padding: 11px 16px; font-weight: 600; color: var(--ink-2); border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); gap: 12px; }
.fact { padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; min-width: 0; }
.fact h3 { margin-bottom: 4px; }
.fact div { overflow-wrap: anywhere; }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 340px); gap: 24px; align-items: start; }
@media (max-width: 820px) { .cols { grid-template-columns: minmax(0, 1fr); } }
.stack { display: flex; flex-direction: column; gap: 16px; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; }
.tag { padding: 2px 9px; border-radius: 999px; background: var(--soft); border: 1px solid var(--line); font-size: 12.5px; color: var(--ink-2); }
.tag.no { background: var(--bad-soft); border-color: transparent; color: var(--bad); }
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { text-align: left; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-3); padding: 8px 10px; border-bottom: 1px solid var(--line); }
.tbl td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl td.n, .tbl th.n { text-align: right; font-variant-numeric: tabular-nums; }
.scroll-x { overflow-x: auto; }
.prop { display: flex; gap: 12px; align-items: flex-start; padding: 14px 0; border-top: 1px solid var(--line); }
.prop:first-child { border-top: 0; }
.prop .pt { flex: 1; min-width: 0; }
.prop .pt b { display: block; overflow-wrap: anywhere; }
.md h1, .md h2, .md h3 { margin: 14px 0 6px; text-transform: none; letter-spacing: 0; color: var(--ink); font-size: 16px; }
.md p, .md ul { margin: 6px 0; } .md ul { padding-left: 20px; }
.md table { border-collapse: collapse; font-size: 14px; } .md td, .md th { border: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }

/* Reiseplan */
.day { border: 1px solid var(--line); border-radius: var(--r); padding: 16px; background: var(--bg); }
.day.over { border-color: var(--accent); background: var(--accent-soft); }
.day-h { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.ent { display: flex; gap: 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); margin-bottom: 8px; cursor: grab; }
.ent.drag { opacity: .4; }
.ent .tm { width: 52px; flex: none; font-weight: 650; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.ent .bd { flex: 1; min-width: 0; }
.ent .bd b { overflow-wrap: anywhere; }
.drop { min-height: 8px; }
.ampel { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.dot { width: 12px; height: 12px; border-radius: 50%; background: var(--idle); }
.dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }
.check { display: flex; gap: 10px; align-items: center; padding: 6px 0; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); }
.check.done span { text-decoration: line-through; color: var(--ink-3); }

/* Formulare */
dialog { width: min(720px, calc(100vw - 24px)); max-height: calc(100vh - 24px); padding: 0; border: 1px solid var(--line); border-radius: 20px; background: var(--bg); color: var(--ink); box-shadow: 0 20px 60px rgba(0,0,0,.35); }

.dlg-h { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 12px; padding: 16px 20px; background: var(--bg); border-bottom: 1px solid var(--line); }
.dlg-b { padding: 20px; display: flex; flex-direction: column; gap: 18px; }
.dlg-f { position: sticky; bottom: 0; display: flex; gap: 10px; justify-content: flex-end; padding: 14px 20px; background: var(--bg); border-top: 1px solid var(--line); }
.fs { display: flex; flex-direction: column; gap: 12px; }
.g2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 12px; }
label.f { display: flex; flex-direction: column; gap: 5px; font-size: 13.5px; font-weight: 600; color: var(--ink-2); min-width: 0; }
.f input, .f select, .f textarea, .in { width: 100%; padding: 9px 12px; border: 1px solid var(--line-2); border-radius: var(--r-s); background: var(--bg); font-weight: 400; color: var(--ink); min-width: 0; }
.f textarea { min-height: 76px; resize: vertical; }
.pick { display: flex; flex-wrap: wrap; gap: 8px; }
.pick label { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border: 1px solid var(--line-2); border-radius: 999px; font-weight: 500; font-size: 14px; cursor: pointer; }
.pick input { accent-color: var(--accent); }
.hint { font-size: 13px; color: var(--ink-3); font-weight: 400; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; padding: 10px 18px; border-radius: 12px; background: var(--ink); color: var(--bg); box-shadow: var(--shadow-hover); max-width: calc(100vw - 32px); }
.skel { border-radius: var(--r); background: linear-gradient(90deg, var(--soft), var(--line), var(--soft)); background-size: 200% 100%; animation: sh 1.3s linear infinite; }
@keyframes sh { to { background-position: -200% 0; } }
@media (max-width: 560px) { .new-card .img { aspect-ratio: auto; height: 84px; flex-direction: row; gap: 12px; } .new-card .img .plus { width: 36px; height: 36px; } h1 { font-size: 24px; } .hero .img { width: 100%; } .nav button { padding: 10px; } .grid { gap: 24px 16px; } }
</style>

<script>
'use strict';
/* ---------- Helfer ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const EUR = new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 });
const eur = (n) => (n == null || n === '' ? '–' : EUR.format(n));
const dat = (iso, kurz) => (iso ? new Date(iso + 'T12:00:00').toLocaleDateString('de-DE', kurz ? { day: 'numeric', month: 'numeric' } : { day: 'numeric', month: 'short', year: 'numeric' }) : '–');
const heute = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
const addDays = (iso, n) => { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
const jetzt = () => new Date().toISOString();
const uid = () => Math.random().toString(36).slice(2, 10);
const clone = (o) => JSON.parse(JSON.stringify(o));
const same = (a, b) => JSON.stringify(a ?? null) === JSON.stringify(b ?? null);
const lines = (t) => String(t || '').split(/\n|,/).map((x) => x.trim()).filter(Boolean);
const ico = (p) => `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="${p}"/></svg>`;
const I = { plus: 'M12 5v14M5 12h14', dots: 'M5 12h.01M12 12h.01M19 12h.01', back: 'M15 18l-6-6 6-6', trash: 'M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14', edit: 'M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z', up: 'M7 17L17 7M8 7h9v9', link: 'M10 13a5 5 0 007 0l3-3a5 5 0 00-7-7l-1 1M14 11a5 5 0 00-7 0l-3 3a5 5 0 007 7l1-1' };

const STATUS = ['Idee', 'Recherche', 'Beobachten', 'Buchungsreif', 'Gebucht'];
const ARTEN = ['Strand', 'Städtetrip', 'Natur/Aktiv', 'Rundreise', 'Skifahren', 'Wellness', 'Sonstiges'];

const trip = (id) => S.trips.find((t) => t.id === id);
const person = (id) => S.travelers.find((p) => p.id === id);
const initials = (n) => String(n || '?').trim().split(/\s+/).map((x) => x[0]).slice(0, 2).join('').toUpperCase();
const avatars = (ids) => `<div class="avatars">${(ids || []).map((i) => person(i)).filter(Boolean).map((p) => `<span class="av" title="${esc(p.name)}" style="background:${AVCOL[hash(p.name) % AVCOL.length]}">${esc(initials(p.name))}</span>`).join('')}</div>`;
const alter = (p) => { if (p.geburt_monat && /^\d{4}-\d{2}$/.test(p.geburt_monat)) { const [y, m] = p.geburt_monat.split('-').map(Number); const n = new Date(); let a = n.getFullYear() - y; if (n.getMonth() + 1 < m) a--; return a; } return p.alter; };

function preise(tid) {
  const rows = S.prices.filter((p) => p.trip === tid && p.preis_pp != null);
  const byDate = {};
  rows.forEach((r) => { byDate[r.datum] = Math.min(byDate[r.datum] ?? Infinity, r.preis_pp); });
  const dates = Object.keys(byDate).sort();
  const last = dates[dates.length - 1], prev = dates[dates.length - 2];
  const cur = rows.filter((r) => r.datum === last).sort((a, b) => a.preis_pp - b.preis_pp)[0];
  const trend = prev ? (byDate[last] < byDate[prev] ? 'down' : byDate[last] > byDate[prev] ? 'up' : 'flat') : null;
  return { dates, series: dates.map((d) => byDate[d]), last, cur, trend, diff: prev ? byDate[last] - byDate[prev] : 0 };
}
function spark(vals) {
  if (!vals || vals.length < 2) return '';
  const w = 64, h = 22, mn = Math.min(...vals), mx = Math.max(...vals), r = mx - mn || 1;
  const pts = vals.map((v, i) => [(i / (vals.length - 1)) * (w - 4) + 2, h - 3 - ((v - mn) / r) * (h - 6)]);
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-label="Preisverlauf"><polyline points="${pts.map((p) => p.join(',')).join(' ')}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="${pts.at(-1)[0]}" cy="${pts.at(-1)[1]}" r="2.6" fill="var(--accent)"/></svg>`;
}

/* ---------- Datenbank ---------- */
function watch(col, key) {
  return db.collection(col).onSnapshot((s) => { S[key] = s.docs.map((d) => ({ id: d.id, ...d.data() })); S.ready[key] = true; render(); }, () => { S.ready[key] = true; render(); });
}
function watchTrip(id) {
  subsTrip.forEach((u) => u()); subsTrip = []; S.plan = null; S.versions = []; S.planVersions = [];
  subsTrip.push(db.doc('plans/' + id).onSnapshot((s) => { S.plan = s.exists ? s.data() : null; S.ready.plan = true; render(); }, () => { S.ready.plan = true; render(); }));
  subsTrip.push(db.collection('plans/' + id + '/versions').onSnapshot((s) => { S.planVersions = s.docs.map((d) => ({ id: d.id, ...d.data() })); render(); }, () => {}));
  subsTrip.push(db.collection('trips/' + id + '/versions').onSnapshot((s) => { S.versions = s.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => (b.datum || '').localeCompare(a.datum || '')); render(); }, () => {}));
}
async function guard(fn, msg) { try { return await fn(); } catch (e) { toast((msg || 'Speichern') + ' hat nicht geklappt: ' + (e && e.message ? e.message : 'unbekannter Fehler')); return null; } }

async function writeTrip(id, next, was) {
  const old = trip(id);
  const skip = new Set(['id', 'geaendert']);
  const nachher = {}, vorher = {};
  Object.keys(next).forEach((k) => { if (skip.has(k)) return; if (!old || !same(next[k], old[k])) { nachher[k] = next[k]; vorher[k] = old ? (old[k] ?? null) : null; } });
  if (old && !Object.keys(nachher).length) return false;
  const doc = { ...next }; delete doc.id; doc.geaendert = jetzt(); if (!old) doc.erstellt = doc.erstellt || jetzt();
  await db.doc('trips/' + id).set(doc);
  await db.collection('trips/' + id + '/versions').add({ datum: jetzt(), wer: S.who, was: was || (old ? 'Geändert: ' + Object.keys(nachher).join(', ') : 'Reise angelegt'), vorher, nachher });
  return true;
}
async function undo(vid) {
  const v = S.versions.find((x) => x.id === vid); const t = trip(S.tripId); if (!v || !t) return;
  const next = { ...clone(t), ...clone(v.vorher || {}) };
  await guard(async () => { await writeTrip(t.id, next, 'Rückgängig: ' + v.was); toast('Rückgängig gemacht'); }, 'Rückgängig');
}
async function savePlan(p, was) {
  const tid = S.tripId, vorher = S.plan ? clone(S.plan) : null;
  await guard(async () => {
    await db.doc('plans/' + tid).set(p);
    await db.collection('plans/' + tid + '/versions').add({ datum: jetzt(), wer: S.who, was: was || 'Reiseplan geändert', vorher });
    const alt = [...S.planVersions].sort((a, b) => (a.datum || '').localeCompare(b.datum || ''));
    for (let i = 0; i < alt.length - 19; i++) await db.doc('plans/' + tid + '/versions/' + alt[i].id).delete();
  }, 'Reiseplan speichern');
}
async function auftrag(art, text, tid) {
  const r = await guard(async () => { await db.collection('auftraege').add({ trip: tid || null, art, text: text || '', status: 'offen', datum: jetzt(), wer: S.who }); return true; }, 'Auftrag ablegen');
  return r === true;
}
/* Weckt die Claude-Sitzung über einen Kommentar „an Claude“. Geht nur für Bearbeiter und solange eine Sitzung die App beobachtet. */
async function wecke(text) {
  try {
    const cm = await claude.use('comments'); if (!cm) return false;
    if ((await cm.canSendToClaude()) !== 'available') return false;
    const anchor = await cm.anchorFor($('#main'));
    await cm.sendToClaude({ anchor, text: String(text).slice(0, 900) }); return true;
  } catch { return false; }
}
async function startSuche(tid, titel, text, art) {
  const lauft = S.auftraege.find((x) => x.trip === tid && x.art === (art || 'suche') && x.status === 'offen');
  if (lauft) { toast('Das läuft schon (angefragt ' + new Date(lauft.datum).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }) + '). Das Ergebnis erscheint in dieser Reise.'); return; }
  const woke = wecke(`Jetzt suchen: „${titel}“ (Reise-ID ${tid}, Auftrag ${art || 'suche'}). ${text || ''}`);
  const ok = await auftrag(art || 'suche', text, tid);
  const w = await woke;
  if (!ok) return;
  toast(w ? 'Suche gestartet. Das Team legt die Ergebnisse in dieser Reise ab.' : 'Auftrag liegt bereit. Sag im Chat: „' + (art === 'optimieren' ? 'Optimiere ' : 'Suche für ') + titel + '“.');
}
function parseWunsch(text) {
  const bm = text.match(/(\d{1,3}(?:[.\s]\d{3})+|\d+)\s*(?:€|eur\b|euro\b)/i);
  const jahr = (text.match(/\b(20\d\d)\b/) || [])[1];
  const ziel = text.split(/[,;]/)[0].trim().slice(0, 60);
  return { ziel, titel: (ziel + (jahr && !ziel.includes(jahr) ? ' ' + jahr : '')).slice(0, 80), budget: bm ? Number(bm[1].replace(/[.\s]/g, '')) : null };
}

/* ---------- Rendern (Shell einmal, danach nur die dynamischen Bereiche) ---------- */
function render() { if (raf) return; raf = requestAnimationFrame(() => { raf = 0; draw(); }); }
function draw() {
  const a = document.activeElement;
  if (a && a.closest && a.closest('#main') && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && !a.dataset.live) { dirty = true; return; }
  dirty = false;
  $('#nav').innerHTML = [['reisen', 'Reisen'], ['backlog', 'Backlog'], ['leute', 'Mitreisende']].map(([k, n]) => `<button data-act="nav" data-v="${k}" ${((S.view === 'reise' ? 'reisen' : S.view) === k) ? 'aria-current="page"' : ''}>${n}</button>`).join('');
  const key = S.view + ':' + (S.tripId || '') + ':' + (S.view === 'reise' ? S.tab : '');
  const V = S.view === 'reise' ? DETAIL : VIEWS[S.view];
  if (!V) return;
  if (S.view === 'reise' && !trip(S.tripId) && S.ready.trips) { S.view = 'reisen'; return draw(); }
  if (key !== shellKey) { shellKey = key; $('#main').innerHTML = '<div class="page">' + V.shell() + '</div>'; window.scrollTo(0, 0); }
  V.fill();
}
document.addEventListener('focusout', () => { if (dirty) setTimeout(render, 0); });

function card(t) {

  const preis = p.cur ? `<span class="price">ab ${eur(p.cur.preis_pp)} <small>p. P.${p.cur.preis_gesamt ? ' · ' + eur(p.cur.preis_gesamt) + ' gesamt' : ''}${p.cur.unsicher ? ' · Richtwert' : ''}</small></span><span class="row" style="gap:8px;flex-wrap:nowrap">${p.trend ? `<span class="trend ${p.trend}" title="seit letztem Check">${p.trend === 'down' ? '↓ ' + eur(Math.abs(p.diff)) : p.trend === 'up' ? '↑ ' + eur(p.diff) : '→ gleich'}</span>` : ''}${spark(p.series)}</span>` : '<span class="meta">Noch kein Preis</span>';

function chart(p) {
  const w = 560, h = 150, pad = 36, mn = Math.min(...p.series) * 0.95, mx = Math.max(...p.series) * 1.05, r = mx - mn || 1;
  const X = (i) => pad + (i / (p.series.length - 1)) * (w - pad - 12), Y = (v) => h - 24 - ((v - mn) / r) * (h - 40);
  const pts = p.series.map((v, i) => [X(i), Y(v)]);
  return `<div class="scroll-x"><svg viewBox="0 0 ${w} ${h}" width="100%" style="min-width:420px;max-width:${w}px" role="img" aria-label="Preisverlauf"><g stroke="var(--line)" stroke-width="1"><line x1="${pad}" x2="${w - 12}" y1="${Y(mx)}" y2="${Y(mx)}"/><line x1="${pad}" x2="${w - 12}" y1="${Y(mn)}" y2="${Y(mn)}"/></g>
  <polyline points="${pts.map((q) => q.join(',')).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round"/>${pts.map((q, i) => `<circle cx="${q[0]}" cy="${q[1]}" r="3.5" fill="var(--accent)"/><text x="${q[0]}" y="${h - 6}" text-anchor="middle" font-size="11" fill="var(--ink-3)">${dat(p.dates[i], true)}</text>`).join('')}
  <text x="4" y="${Y(mx) + 4}" font-size="11" fill="var(--ink-3)">${eur(Math.round(mx))}</text><text x="4" y="${Y(mn) + 4}" font-size="11" fill="var(--ink-3)">${eur(Math.round(mn))}</text></svg></div>`;
}
function md(src) {
  const inl = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  const out = []; const L = String(src || '').split('\n'); let i = 0;
  while (i < L.length) {
    const l = L[i];
    if (/^\|/.test(l) && /^\|[\s:|-]+\|?$/.test(L[i + 1] || '')) { const head = l.split('|').slice(1, -1); i += 2; const body = []; while (i < L.length && /^\|/.test(L[i])) { body.push(L[i].split('|').slice(1, -1)); i++; } out.push(`<div class="scroll-x"><table><thead><tr>${head.map((c) => `<th>${inl(c.trim())}</th>`).join('')}</tr></thead><tbody>${body.map((r) => `<tr>${r.map((c) => `<td>${inl(c.trim())}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`); continue; }
    if (/^#{1,3} /.test(l)) { out.push(`<h3>${inl(l.replace(/^#+ /, ''))}</h3>`); i++; continue; }
    if (/^[-*] /.test(l)) { const it = []; while (i < L.length && /^[-*] /.test(L[i])) { it.push(`<li>${inl(L[i].slice(2))}</li>`); i++; } out.push(`<ul>${it.join('')}</ul>`); continue; }
    if (l.trim()) out.push(`<p>${inl(l)}</p>`); i++;
  }
  return out.join('');
}

function pdfBytes(zeilen) {
  const win = (t) => String(t ?? '').replace(/€/g, 'EUR').replace(/[–—]/g, '-').replace(/[„“”]/g, '"').replace(/[’‘]/g, "'").replace(/→/g, '->').replace(/·/g, '-').replace(/[^\x20-\x7e\xa0-\xff]/g, '?');
  const esc2 = (t) => win(t).replace(/\\/g, '\\\\').replace(/\(/g, '\\(').replace(/\)/g, '\\)');
  const W = 595, H = 842, M = 50, pages = [[]]; let y = H - M;
  zeilen.forEach((z) => {
    const sz = z.size || 11, max = Math.floor((W - 2 * M) / (sz * 0.52)), lead = sz * 1.5; const words = win(z.t).split(' '); let cur = '';
    const push = (txt) => { if (y - lead < M) { pages.push([]); y = H - M; } y -= lead; pages[pages.length - 1].push({ y, t: txt, sz, b: !!z.b }); };
    if (!words.join('')) { push(''); return; }
    words.forEach((w) => { if ((cur + ' ' + w).trim().length > max && cur) { push(cur); cur = w; } else cur = (cur + ' ' + w).trim(); }); push(cur);
  });
  const objs = []; const add = (o) => { objs.push(o); return objs.length; };
  add('<< /Type /Catalog /Pages 2 0 R >>'); add(''); add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>'); add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
  const kids = pages.map((pg) => { const c = pg.map((l) => `BT /${l.b ? 'F2' : 'F1'} ${l.sz} Tf ${M} ${l.y.toFixed(1)} Td (${esc2(l.t)}) Tj ET`).join('\n'); const ci = add(`<< /Length ${c.length} >>\nstream\n${c}\nendstream`); return add(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${ci} 0 R >>`); });
  objs[1] = `<< /Type /Pages /Count ${kids.length} /Kids [${kids.map((k) => k + ' 0 R').join(' ')}] >>`;
  let out = '%PDF-1.4\n'; const off = [];
  objs.forEach((o, i) => { off.push(out.length); out += `${i + 1} 0 obj\n${o}\nendobj\n`; });
  const x = out.length; out += `xref\n0 ${objs.length + 1}\n0000000000 65535 f \n` + off.map((o) => String(o).padStart(10, '0') + ' 00000 n \n').join('') + `trailer\n<< /Size ${objs.length + 1} /Root 1 0 R >>\nstartxref\n${x}\n%%EOF`;
  return Uint8Array.from(out, (c) => c.charCodeAt(0) & 255);
}
async function save(filename, data) {

}
